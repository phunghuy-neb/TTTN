version: "3.8"

services:
  tour-ai-service:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - CHROMA_URL=http://chromadb:8000
    depends_on:
      - chromadb
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  chroma_data:
