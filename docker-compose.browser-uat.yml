name: vietvoyage-browser-uat

services:
  mongo:
    # MongoDB 8.0 refuses Linux kernels >= 6.19 (SERVER-121912); 8.2 supports this host.
    image: mongo:8.2
    command: ["mongod", "--replSet", "uatrs", "--bind_ip_all", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - browser_uat_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - browser_uat_chroma_data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000;
          printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r line <&3;
          [[ "$$line" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  tour-ai-service:
    build:
      context: ./ai/tour-ai-service
    env_file:
      - ./ai/tour-ai-service/.env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27018/vietvoyage_browser_uat?directConnection=true
      CHROMA_URL: http://chromadb:8000
      CHROMA_COLLECTION: tour_vectors_browser_uat
      AI_SERVICE_PORT: 4000
      AI_INTERNAL_API_KEY: ${AI_SERVICE_API_KEY:-}
      GEMINI_PROVIDER_MODE: ${GEMINI_PROVIDER_MODE:-google}
      SHOPAIKEY_API_KEY: ${SHOPAIKEY_API_KEY:-}
      SHOPAIKEY_GEMINI_BASE_URL: ${SHOPAIKEY_GEMINI_BASE_URL:-https://api.shopaikey.com}
      AUTO_RECONCILE_INDEX: "true"
    ports:
      - "127.0.0.1:14000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27018/vietvoyage_browser_uat?directConnection=true
      AI_SERVICE_URL: http://tour-ai-service:4000/api/ai
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      CHAT_TRACE_LOGGING: "true"
      CLIENT_URL: http://127.0.0.1:15173
      CORS_ORIGINS: http://127.0.0.1:15173,http://localhost:15173
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:15000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      tour-ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./TTTN
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  browser_uat_mongo_data:
  browser_uat_chroma_data:
